name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER_STR=$(java -version 2>&1 | head -n 1)
          if [[ "$JAVA_VER_STR" =~ version\ \"([0-9]+) ]]; then
            MAJOR_VER="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VER_STR" =~ ([0-9]+)\. ]]; then
            MAJOR_VER="${BASH_REMATCH[1]}"
          else
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi
          echo "Active Java Major Version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer, found $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary release keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -storepass release123 \
            -alias release-key \
            -keypass release123 \
            -dname "CN=Release Signing,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          if [ ! -f release.keystore ]; then
            echo "ERROR: release.keystore generation failed."
            exit 1
          fi

          echo "Confirmed release.keystore exists."
          echo "KEYSTORE_FILE=$(pwd)/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=release123" >> $GITHUB_ENV
          echo "KEY_ALIAS=release-key" >> $GITHUB_ENV
          echo "KEY_PASSWORD=release123" >> $GITHUB_ENV

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected release APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk/release" ]; then
              echo "Discovered APKs inside app/build/outputs/apk/release:"
              find app/build/outputs/apk/release -name "*.apk"
            fi
            exit 1
          fi

          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ] && [[ "$EXPECTED_APK" == *.apk ]] && [ "$EXPECTED_APK" = "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Verified $EXPECTED_APK exists, is a regular file, is not empty, has .apk extension, and matches exact path."
          else
            echo "ERROR: APK validation failed for $EXPECTED_APK"
            exit 1
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Release asset validation failed. Skipping release creation."
            exit 1
          fi

          TAG_NAME="release-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Release APK #${{ github.run_number }}"
          TARGET_SHA="${{ github.sha }}"

          NOTES=$(cat <<EOF
          This is an automatically generated production release APK.
          The APK was built with R8 optimization and resource shrinking by GitHub Actions.
          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${TARGET_SHA}

          Note: Signed with temporary release keystore for testing and sideloading.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$TARGET_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="release-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="app-release.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            RELEASE_INFO=$(gh release view "$TAG_NAME" --json url,title,tagName || true)
            if [ -n "$RELEASE_INFO" ]; then
              RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.url // empty')
              RELEASE_TITLE=$(echo "$RELEASE_INFO" | jq -r '.title // empty')
            fi

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: ${RELEASE_TITLE:-$TAG_NAME}"
            echo "Release URL: ${RELEASE_URL:-https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME}"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 GitHub Release Published Successfully" >> $GITHUB_STEP_SUMMARY
            echo "The release APK can be downloaded directly from the [GitHub Release Page](${RELEASE_URL:-https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME})." >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Name:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact:** The Actions artifact \`release-apk\` is also available." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publishing failed or was skipped."
            echo "APK Build Succeeded."
            echo "The Actions artifact named release-apk remains available."

            echo "### ⚠️ Release Publishing Notice" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded and the artifact \`release-apk\` remains available in GitHub Actions." >> $GITHUB_STEP_SUMMARY
            echo "GitHub Release publishing did not complete." >> $GITHUB_STEP_SUMMARY
          fi
